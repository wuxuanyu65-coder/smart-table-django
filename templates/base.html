{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}SmartTable{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QLlJ9p2zq" crossorigin="anonymous">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script>
        (function () {
            function getCookie(name) {
                const value = `; ${document.cookie}`;
                const parts = value.split(`; ${name}=`);
                if (parts.length === 2) return parts.pop().split(';').shift();
            }
            document.addEventListener('htmx:configRequest', function (evt) {
                const token = getCookie('csrftoken');
                if (token) {
                    evt.detail.headers['X-CSRFToken'] = token;
                }
            });
        })();
    </script>
</head>
<body>
    {% include "partials/navbar.html" %}
    <main class="container my-3">
        {% block content %}{% endblock %}
    </main>
    <div id="cart-live" class="visually-hidden" aria-live="polite"></div>
    {% include "partials/footer.html" %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-Qzq1Yt" crossorigin="anonymous"></script>
    {% block scripts %}{% endblock %}
</body>
</html>

{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}SmartTable{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">

</head>

<body>

<header class="navbar">

    <div class="nav-left">
        {% block nav_left %}☰{% endblock %}
    </div>

    <div class="nav-title">
        {% block nav_title %}SmartTable{% endblock %}
    </div>

    <div class="nav-right">
        {% block nav_right %}🛒{% endblock %}
    </div>

</header>

<main class="container">
    {% block content %}
    {% endblock %}
</main>

{% block scripts %}
{% endblock %}

</body>
</html>
